name: Build JobFinder APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      # ============================================================
      # 1. Tải mã nguồn từ GitHub Repository về máy ảo
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Cấu hình môi trường Java phục vụ dự án Java thuần
      # ============================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # ============================================================
      # 3. Tự động định vị Root Project và Build APK bằng Gradle phù hợp
      # ============================================================
      - name: Fix Path and Build Android App
        shell: bash
        run: |
          echo "=====[ 1. TỰ ĐỘNG DÒ TÌM THƯ MỤC GỐC DỰ ÁN ]====="
          # Tìm file settings.gradle để xác định chính xác thư mục gốc (Root) của dự án Android
          SETTINGS_FILE=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)
          
          if [ -z "$SETTINGS_FILE" ]; then
            echo "⚠️ Không thấy settings.gradle, thử tìm build.gradle ở tầng cao nhất..."
            SETTINGS_FILE=$(find . -name "build.gradle" | sort | head -n 1)
          fi
          
          if [ -z "$SETTINGS_FILE" ]; then
            echo "❌ LỖI: Không định vị được cấu trúc dự án Android!"
            exit 1
          fi
          
          TARGET_DIR=$(dirname "$SETTINGS_FILE")
          echo "➡️ Thư mục gốc dự án được xác định tại: $TARGET_DIR"
          cd "$TARGET_DIR"
          
          echo "=====[ 2. KHỞI TẠO HOẶC CẤP QUYỀN GRADLE WRAPPER V8.4 ]====="
          # Ép hệ thống sử dụng phiên bản cố định Gradle 8.4 nhằm tránh lỗi xung đột trên GitHub
          if [ -f "./gradlew" ]; then
            echo "-> Tìm thấy gradlew có sẵn, tiến hành cấp quyền thực thi..."
            chmod +x ./gradlew
          else
            echo "-> Tự động tạo cấu hình Gradle Wrapper bản ổn định 8.4..."
            gradle wrapper --gradle-version 8.4
            chmod +x ./gradlew
          fi
          
          echo "=====[ 3. TIẾN HÀNH BIÊN DỊCH FILE APK ]====="
          # Chạy lệnh biên dịch kèm hiển thị chi tiết stacktrace nếu phát sinh lỗi nguồn
          ./gradlew assembleDebug --stacktrace

      # ============================================================
      # 4. Đóng gói và xuất file APK ra ngoài tab Actions
      # ============================================================
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jobfinder-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          retention-days: 7
