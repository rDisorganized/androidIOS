name: Build Worker APK
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      # ============================================================
      # 1. Tải mã nguồn từ GitHub Repository về máy ảo
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Cấu hình môi trường Java phục vụ dự án Java thuần
      # ============================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # ============================================================
      # 2b. Cài Android SDK (Bản v4 xóa bỏ hoàn toàn lỗi 'tools' cũ)
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # ============================================================
      # 3. Tự động định vị Root Project và Build APK bằng Gradle phù hợp
      # ============================================================
      - name: Fix Path and Build Android App
        id: build_step
        shell: bash
        run: |
          echo "=====[ 1. TỰ ĐỘNG DÒ TÌM THƯ MỤC GỐC DỰ ÁN ]====="
          SETTINGS_FILE=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "⚠️ Không thấy settings.gradle, thử tìm build.gradle ở tầng cao nhất..."
            SETTINGS_FILE=$(find . -name "build.gradle" | sort | head -n 1)
          fi
          
          if [ -z "$SETTINGS_FILE" ]; then
            echo "❌ LỖI: Không định vị được cấu trúc dự án Android!"
            exit 1
          fi
          
          TARGET_DIR=$(dirname "$SETTINGS_FILE")
          echo "➡️ Thư mục gốc dự án được xác định tại: $TARGET_DIR"
          echo "target_dir=$TARGET_DIR" >> $GITHUB_OUTPUT
          
          cd "$TARGET_DIR"
          
          if [ -n "$ANDROID_HOME" ]; then
            echo "sdk.dir=$ANDROID_HOME" | sed 's/\\/\\\\/g' > local.properties
            echo "➡️ Đã ghi local.properties"
          fi
          
          echo "=====[ 2. NÂNG CẤP VÀ ĐỒNG BỘ GRADLE WRAPPER V8.4 ]====="
          # Ép hệ thống dùng Gradle 8.4 tương thích 100% với JDK 17, tránh lỗi xung đột phiên bản
          gradle wrapper --gradle-version 8.4 --distribution-type bin
          chmod +x ./gradlew
          
          echo "=====[ 3. TIẾN HÀNH BIÊN DỊCH FILE APK ]====="
          # Chạy build kèm cờ --no-daemon để tối ưu RAM cho máy ảo GitHub Actions
          ./gradlew assembleDebug --stacktrace --no-daemon

      # ============================================================
      # 4. Đóng gói và xuất file APK ra ngoài tab Actions
      # ============================================================
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jobfinder-debug-apk
          # Định vị chuẩn xác tuyệt đối thư mục đầu ra dựa vào target_dir đã quét được ở trên
          path: '${{ github.workspace }}/${{ steps.build_step.outputs.target_dir }}/**/build/outputs/apk/debug/*.apk'
          retention-days: 7
          if-no-files-found: error
