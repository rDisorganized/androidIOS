name: Build worker APK
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Chỉ cần Java 17, hệ điều hành ubuntu-latest đã tích hợp sẵn đầy đủ Android SDK mặc định
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android App
        shell: bash
        run: |
          # 1. Tìm thư mục chứa file cấu hình dự án
          SETTINGS_FILE=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)
          TARGET_DIR=$(dirname "$SETTINGS_FILE")
          cd "$TARGET_DIR"

          # 2. Cấp quyền chạy cho Gradle
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            echo "sdk.dir=$ANDROID_HOME" > local.properties
            gradle wrapper --gradle-version 8.4
            chmod +x ./gradlew
          fi

          # 3. Biên dịch ứng dụng
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jobfinder-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 7
          if-no-files-found: error
