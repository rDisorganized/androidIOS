name: Build worker APK
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      # ============================================================
      # 1. Tải mã nguồn từ GitHub Repository về máy ảo
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Cấu hình môi trường Java phục vụ dự án Java thuần
      # ============================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # ============================================================
      # 2b. Cài Android SDK (Đã nâng cấp lên v4 để SỬA HOÀN TOÀN lỗi 'tools')
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # ============================================================
      # 3. Tự động định vị Root Project và Build APK bằng Gradle phù hợp
      # ============================================================
      - name: Fix Path and Build Android App
        id: build_step
        shell: bash
        run: |
          echo "=====[ 1. TỰ ĐỘNG DÒ TÌM THƯ MỤC GỐC DỰ ÁN ]====="
          SETTINGS_FILE=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "⚠️ Không thấy settings.gradle, thử tìm build.gradle ở tầng cao nhất..."
            SETTINGS_FILE=$(find . -name "build.gradle" | sort | head -n 1)
          fi
          
          if [ -z "$SETTINGS_FILE" ]; then
            echo "❌ LỖI: Không định vị được cấu trúc dự án Android!"
            exit 1
          fi
          
          # Loại bỏ ký tự './' ở đầu nếu có để làm sạch chuỗi đường dẫn
          TARGET_DIR=$(dirname "$SETTINGS_FILE" | sed 's|^\./||; s|^\.||')
          echo "➡️ Thư mục gốc dự án được xác định tại: $TARGET_DIR"
          
          # Lưu đường dẫn tương đối để truyền sang bước upload artifact
          echo "target_dir=$TARGET_DIR" >> $GITHUB_OUTPUT
          
          cd "$TARGET_DIR" || exit 1
          
          if [ -n "$ANDROID_HOME" ]; then
            echo "sdk.dir=$ANDROID_HOME" | sed 's/\\/\\\\/g' > local.properties
            echo "➡️ Đã ghi local.properties với ANDROID_HOME=$ANDROID_HOME"
          elif [ -n "$ANDROID_SDK_ROOT" ]; then
            echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
            echo "➡️ Đã ghi local.properties với ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          fi
          
          echo "=====[ 2. KHỞI TẠO HOẶC CẤP QUYỀN GRADLE WRAPPER V8.4 ]====="
          if [ -f "./gradlew" ]; then
            echo "-> Tìm thấy gradlew có sẵn, tiến hành cấp quyền thực thi..."
            chmod +x ./gradlew
          else
            echo "-> Tự động tạo cấu hình Gradle Wrapper bản ổn định 8.4..."
            gradle wrapper --gradle-version 8.4
            chmod +x ./gradlew
          fi
          
          echo "=====[ 3. TIẾN HÀNH BIÊN DỊCH FILE APK ]====="
          ./gradlew assembleDebug --stacktrace

      # ============================================================
      # 4. Đóng gói và xuất file APK ra ngoài tab Actions
      # ============================================================
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jobfinder-debug-apk
          # Sử dụng cấu trúc đường dẫn Linux chuẩn, loại bỏ khoảng trống thừa
          path: ${{ github.workspace }}/${{ steps.build_step.outputs.target_dir }}/**/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error
